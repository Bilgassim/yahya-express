<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="brandRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E60000" />
      <stop offset="100%" stop-color="#A50000" />
    </linearGradient>
  </defs>
  
  <!-- Background Rounded Shield/Square -->
  <rect width="500" height="500" rx="60" fill="url(#brandRedGrad)"/>
  
  <!-- Central Emblem Circle -->
  <g transform="translate(250, 185)">
    <circle cx="0" cy="0" r="125" fill="#FFFFFF" opacity="0.98"/>
    
    <!-- Speed Lines Left & Right -->
    <rect x="-175" y="-35" width="85" height="14" rx="7" fill="#FFFFFF" />
    <rect x="-160" y="-8" width="70" height="14" rx="7" fill="#FFFFFF" />
    <rect x="-185" y="19" width="95" height="14" rx="7" fill="#FFFFFF" />
    <rect x="-150" y="46" width="60" height="14" rx="7" fill="#FFFFFF" />
    
    <rect x="90" y="-35" width="85" height="14" rx="7" fill="#FFFFFF" />
    <rect x="90" y="-8" width="70" height="14" rx="7" fill="#FFFFFF" />
    <rect x="90" y="19" width="95" height="14" rx="7" fill="#FFFFFF" />
    <rect x="90" y="46" width="60" height="14" rx="7" fill="#FFFFFF" />

    <!-- Stylized "Y" Cutout in Red -->
    <path d="M -85 -105 L -20 -5 L -20 100 L 20 100 L 20 -5 L 85 -105 L 42 -105 L 0 -35 L -42 -105 Z" fill="#D60000" />
    
    <rect x="-70" y="-12" width="140" height="8" rx="4" fill="#D60000" />
    <rect x="-65" y="12" width="130" height="8" rx="4" fill="#D60000" />
    <rect x="-55" y="36" width="110" height="8" rx="4" fill="#D60000" />
  </g>
  
  <!-- Text Brand "YAHYA" -->
  <text x="250" y="375" font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', Arial, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="7">
    YAHYA
  </text>
  
  <!-- Subtitle "EXPRESS" flanked by lines -->
  <g transform="translate(250, 425)">
    <line x1="-165" y1="-7" x2="-95" y2="-7" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="10">
      EXPRESS
    </text>
    <line x1="95" y1="-7" x2="165" y2="-7" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
